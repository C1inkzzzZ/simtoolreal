# Trajectory-goal settings, merged into task.env.trajectory by launch_from_pretrained.py --task trajectory.
# Design and rationale: README section 14. Every value can be overridden, e.g. task.env.trajectory.motionBlockProb=0.5

motionBlockProb: 0.6        # new goals that start a motion block; the rest are official static goals (40% static)
passBudget: 1.0             # all moving waypoints of a block together pay up to passBudget * reachGoalBonus
vFloor: 0.1                 # m/s, velocity error is judged relative to max(|v_g|, vFloor)
abandonDist: 0.15           # m, head farther than this from the current waypoint abandons the rest of the block
reachDist: 0.015            # m, keypoint distance that advances a moving waypoint without crossing it (< spacing / 2)
chainProb: 0.5              # after an end stop, start the next block right there (no new set pose)

# sampler constants (trajectory_goals.TrajParams)
aMax: 3.0                   # m/s^2 along the path
spacing: 0.03               # m between waypoints
kMax: 48                    # waypoints per block at most
downFrac: 0.25              # blocks whose start direction is steep downward
volumeMargin: 0.10          # m the moving waypoints may leave the target volume (end stops stay inside)
minHeadZ: 0.58              # head center above this everywhere (table top ~0.53)
tries: 8

# (start, end) values, interpolated by the curriculum level in [0, 1]
vMax: [0.35, 0.6]           # m/s, peak head speed limit of a block
bendDeg: [0.0, 90.0]        # bend segments: curvature
rotMaxDeg: [0.0, 150.0]     # bend segments: orientation change per segment
nSegMax: [1, 6]             # segments per block: 1..nSegMax
coneDeg: [30.0, 180.0]      # start direction vs the head's face axis
pArc: [0.0, 0.4]            # share of arc (rigid-rotation) segments
arcMaxDeg: [0.0, 180.0]     # arc segments: max swept angle
epsKp: [0.06, 0.01]         # m, keypoint distance for a pass to count as a success (Leo's end value); not the advance rule
sigmaPos: [0.05, 0.01]      # m, q_pos = exp(-kp_dist / sigmaPos)
sigmaV: [1.0, 0.15]         # q_v = exp(-|dv| / (sigmaV * max(|v_g|, vFloor)))
epsV: [0.6, 0.15]           # velocity success: |dv| < epsV * max(|v_g|, vFloor) (Leo's end value)
armSpeedMult: [1.5, 6.0]    # multiplies the arm joint-target speed

curriculum:
  initLevel: 0.0
  fixedLevel: null          # freeze (evaluation, ablations)
  step: 0.05
  upThreshold: 0.5          # moving-waypoint success rate of a block
  downThreshold: 0.2
  minSamples: 4096          # finished moving waypoints per decision block
  staticGuard: 0.5
  minStepsBetween: 160
